<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dEX Cozy Interactive Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        #error-log {
            position: absolute; top: 0; left: 0; z-index: 999999; background: red; color: white; padding: 20px; font-size: 20px; font-family: sans-serif;
            display: none; width: 100%; box-sizing: border-box;
        }
        body { margin: 0; overflow: hidden; background-color: #b3e5fc; font-family: 'Fredoka', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #interaction-toast {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%) translateY(20px) scale(0.9);
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); 
            border: 4px solid #795548; color: #5d4037; padding: 12px 32px; border-radius: 20px;
            font-size: 1.5rem; font-weight: bold; opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 4px 4px 0 rgba(121,85,72,0.3); pointer-events: none;
        }
        #interaction-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

        #controls-help {
            position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 16px; color: #5d4037;
            border: 3px solid #795548; box-shadow: 4px 4px 0 rgba(121,85,72,0.2); pointer-events: auto;
        }

        #audio-control {
            position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); width: 50px; height: 50px; border-radius: 50%; 
            color: #5d4037; border: 3px solid #795548; box-shadow: 4px 4px 0 rgba(121,85,72,0.2); 
            pointer-events: auto; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; transition: all 0.2s;
        }
        #audio-control:hover { transform: scale(1.1); }
        #audio-control.muted { color: #f43f5e; }

        /* Emoji Overlay container */
        .emoji-bubble {
            position: absolute; font-size: 3.5rem; pointer-events: none;
            user-select: none; z-index: 9999;
        }

        /* RPG Dialogue UI */
        #rpg-dialogue-container {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%) translateY(100%);
            width: 90%; max-width: 800px; background: rgba(255, 255, 255, 0.98);
            border: 5px solid #795548; border-radius: 20px; padding: 30px; box-shadow: 10px 10px 0 rgba(121,85,72,0.3);
            pointer-events: auto; opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; flex-direction: column; gap: 20px; z-index: 100;
        }
        #rpg-dialogue-container.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .npc-name {
            position: absolute; top: -25px; left: 20px; background: #8bc34a; color: white;
            padding: 5px 20px; border-radius: 10px; border: 3px solid #795548; font-weight: bold;
        }
        
        .dialogue-choice {
            background: #f1f5f9; border: 3px solid #cbd5e1; border-radius: 12px; padding: 12px 20px;
            cursor: pointer; font-weight: 600; transition: all 0.2s; text-align: left; color: #5d4037;
        }
        .dialogue-choice:hover { background: #8bc34a; color: white; border-color: #689f38; transform: translateX(10px); }

        /* Gacha & Tarot Result UI */
        .modal-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.98); border: 5px solid #795548; 
            border-radius: 30px; padding: 40px; text-align: center; pointer-events: auto; opacity: 0; 
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            z-index: 200; min-width: 400px;
        }
        .modal-container.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        
        .tarot-img {
            max-width: 250px; border-radius: 15px; margin: 0 auto 20px; border: 4px solid #5d4037;
            box-shadow: 5px 5px 0 #d7ccc8;
        }

        .btn-close {
            background: #8bc34a; border: 3px solid #5d4037; padding: 10px 30px; border-radius: 20px;
            font-weight: bold; color: white; cursor: pointer; margin-top: 20px; transition: all 0.2s;
        }
        .btn-close:hover { background: #689f38; transform: scale(1.05); }

    </style>
</head>
<body>
    <div id="error-log"></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const errDiv = document.getElementById('error-log');
            errDiv.style.display = 'block';
            errDiv.innerHTML += `<p><strong>Error:</strong> ${msg} at line ${line}</p>`;
        };
    </script>
    
    <!-- Audio Elements -->
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- Help Overlay -->
    <div id="controls-help">
        <div class="font-bold text-lg mb-2 text-indigo-600"><i class="fas fa-gamepad mr-2"></i>How to play</div>
        <div class="text-sm font-semibold mb-1"><strong>W A S D</strong> to walk</div>
        <div class="text-sm font-semibold mb-1"><strong>1, 2, 3</strong> for Emojis</div>
        <div class="text-sm font-semibold text-rose-500 mt-2"><strong>[Esc]</strong> or <strong>Walk Away</strong> to Exit menu</div>
        <a href="/" class="inline-block mt-4 text-sm bg-rose-400 text-white px-3 py-1 rounded-full font-bold hover:bg-rose-500 transition-colors shadow-[2px_2px_0_#333] border-2 border-slate-800"><i class="fas fa-sign-out-alt mr-1"></i>Leave Island</a>
    </div>

    <!-- Audio Toggle -->
    <div id="audio-control" class="muted" title="Toggle Sound">
        <i class="fas fa-volume-mute"></i>
    </div>

    <!-- Interaction UI -->
    <div id="ui-layer">
        <div id="interaction-toast">Press [E] to Talk</div>
    </div>

    <!-- RPG Dialogue UI -->
    <div id="rpg-dialogue-container">
        <div class="npc-name" id="npc-name">NPC</div>
        <div id="dialogue-text" class="text-xl font-bold text-slate-800">...</div>
        <div id="dialogue-choices" class="flex flex-col gap-3 mt-4"></div>
    </div>

    <!-- Gacha Result UI -->
    <div id="gacha-result-container" class="modal-container">
        <h2 class="text-2xl font-bold text-slate-500 mb-2">🎉 จักรวาลประทานพร! 🎉</h2>
        <h1 id="gacha-restaurant-name" class="text-5xl font-black text-rose-500 mb-6 drop-shadow-md">ร้านอาหาร</h1>
        <button class="btn-close" onclick="closeModal()">ยอมรับชะตากรรม 🙏</button>
    </div>

    <!-- Tarot Result UI -->
    <div id="tarot-result-container" class="modal-container">
        <h2 class="text-2xl font-bold text-slate-500 mb-4">🔮 ไพ่ทำนายความสุขในการกิน 🔮</h2>
        <img id="tarot-image" src="/tarot/fool.png" class="tarot-img">
        <h1 id="tarot-title" class="text-3xl font-black text-purple-600 mb-2">The Starving Fool</h1>
        <div class="text-xl font-bold text-slate-700 mb-2">ความสุข: <span id="tarot-happiness" class="text-rose-500">10%</span></div>
        <p id="tarot-desc" class="text-lg text-slate-600 font-medium mb-4 italic">"จะได้กินของอร่อย... แต่ลืมเอากระเป๋าตังค์มา!"</p>
        <button class="btn-close" onclick="closeModal()">สาธุ 🙏</button>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Data Source -->
    <script src="/quiz-data.js"></script>
    
    <!-- Game Logic -->
    <script src="/city.js?v=clean"></script>

</body>
</html>
